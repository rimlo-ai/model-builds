name: Nemotron

# Every push builds the speech-recognition models from NVIDIA's pinned checkpoint and checks them against PyTorch.
# A tag named nemotron-<version>-r<revision> (matching nemotron/versions.sh) also publishes them as a release.
on:
  push:
    branches: [main]
    tags: ['nemotron-*-r*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          "$RUNNER_TEMP/venv/bin/pip" install --only-binary=:all: -r nemotron/requirements.txt
      # Quantized kernels differ by CPU, so record which one verified the build.
      - run: lscpu | grep -E 'Model name|Flags'
      - run: nemotron/build.sh "$RUNNER_TEMP/work"
        env:
          PYTHON: ${{ runner.temp }}/venv/bin/python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nemotron
          path: ${{ runner.temp }}/work/dist
          if-no-files-found: error
          retention-days: 3
      # A failed verification keeps what it checked, to look into.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nemotron-failed
          path: ${{ runner.temp }}/work/dist
          retention-days: 3

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nemotron
          path: dist
      - run: nemotron/release.sh dist release "$RUNNER_TEMP/notes.md"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/nemotron-*
      - run: gh release create "$GITHUB_REF_NAME" release/* --title "Nemotron $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
